name: CD

on:
  push:
    branches:
      - main
    paths:
      - api/**
      - backend/**
      - frontend/**
      - model_services/**
      - deploy/**
      - docker-compose.yml
      - .dockerignore
      - .github/workflows/cd.yml

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/callmeeric5/distillation-studio-api
  CALL_ME_MAYBE_MODEL_IMAGE: ghcr.io/callmeeric5/distillation-studio-call-me-maybe-model
  FRONTEND_IMAGE: ghcr.io/callmeeric5/distillation-studio-frontend
  DEPLOY_DIR: /home/ubuntu/distillation-studio
  IMAGE_PLATFORM: linux/arm64

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      frontend: ${{ steps.filter.outputs.frontend }}
      model: ${{ steps.filter.outputs.model }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          base_sha="${{ github.event.before }}"
          if [[ -z "$base_sha" || "$base_sha" == "0000000000000000000000000000000000000000" ]]; then
            echo "api=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "model=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only "$base_sha" "${{ github.sha }}" > /tmp/changed-files

          if grep -Eq '^(api/|backend/|api/Dockerfile$|\.dockerignore$|\.github/workflows/cd\.yml$)' /tmp/changed-files; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=false" >> "$GITHUB_OUTPUT"
          fi

          if grep -Eq '^(frontend/|\.dockerignore$|\.github/workflows/cd\.yml$)' /tmp/changed-files; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

          if grep -Eq '^(model_services/call_me_maybe/|\.dockerignore$|\.github/workflows/cd\.yml$)' /tmp/changed-files; then
            echo "model=true" >> "$GITHUB_OUTPUT"
          else
            echo "model=false" >> "$GITHUB_OUTPUT"
          fi

  build-api:
    name: Build and push API image
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.api == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./api/Dockerfile
          platforms: ${{ env.IMAGE_PLATFORM }}
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.API_IMAGE }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  build-frontend:
    name: Build and push frontend image
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: ${{ env.IMAGE_PLATFORM }}
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  build-model:
    name: Build and push Call_Me_Maybe model image
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.model == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push Call_Me_Maybe model image
        uses: docker/build-push-action@v6
        with:
          context: ./model_services/call_me_maybe
          file: ./model_services/call_me_maybe/Dockerfile
          platforms: ${{ env.IMAGE_PLATFORM }}
          push: true
          tags: |
            ${{ env.CALL_ME_MAYBE_MODEL_IMAGE }}:${{ github.sha }}
            ${{ env.CALL_ME_MAYBE_MODEL_IMAGE }}:latest
          cache-from: type=gha,scope=call-me-maybe-model
          cache-to: type=gha,mode=max,scope=call-me-maybe-model

  deploy:
    name: Deploy on Oracle server
    runs-on: ubuntu-latest
    needs:
      - changes
      - build-api
      - build-frontend
      - build-model
    if: |
      always() &&
      (needs.build-api.result == 'success' || needs.build-api.result == 'skipped') &&
      (needs.build-frontend.result == 'success' || needs.build-frontend.result == 'skipped') &&
      (needs.build-model.result == 'success' || needs.build-model.result == 'skipped')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload Compose file
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" "mkdir -p '${{ env.DEPLOY_DIR }}/deploy/postgres'"
          scp -i ~/.ssh/deploy_key docker-compose.yml "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ env.DEPLOY_DIR }}/docker-compose.yml"
          scp -i ~/.ssh/deploy_key deploy/postgres/init-databases.sql "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ env.DEPLOY_DIR }}/deploy/postgres/init-databases.sql"

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" << 'EOF'
          set -eu
          cd '${{ env.DEPLOY_DIR }}'
          API_IMAGE_TAG_LINE=''
          FRONTEND_IMAGE_TAG_LINE=''
          MODEL_IMAGE_TAG_LINE=''
          TRACEOPS_PASSWORD_LINE=''
          if [ -f .env ]; then
            API_IMAGE_TAG_LINE=$(grep '^API_IMAGE_TAG=' .env || true)
            FRONTEND_IMAGE_TAG_LINE=$(grep '^FRONTEND_IMAGE_TAG=' .env || true)
            MODEL_IMAGE_TAG_LINE=$(grep '^CALL_ME_MAYBE_MODEL_IMAGE_TAG=' .env || true)
            TRACEOPS_PASSWORD_LINE=$(grep '^TRACEOPS_POSTGRES_PASSWORD=' .env || true)
          fi

          if [ '${{ needs.changes.outputs.api }}' = 'true' ]; then
            printf 'API_IMAGE_TAG=%s\n' '${{ github.sha }}' > .env
          elif [ -n "$API_IMAGE_TAG_LINE" ]; then
            printf '%s\n' "$API_IMAGE_TAG_LINE" > .env
          else
            printf 'API_IMAGE_TAG=latest\n' > .env
          fi

          if [ '${{ needs.changes.outputs.frontend }}' = 'true' ]; then
            printf 'FRONTEND_IMAGE_TAG=%s\n' '${{ github.sha }}' >> .env
          elif [ -n "$FRONTEND_IMAGE_TAG_LINE" ]; then
            printf '%s\n' "$FRONTEND_IMAGE_TAG_LINE" >> .env
          else
            printf 'FRONTEND_IMAGE_TAG=latest\n' >> .env
          fi

          if [ '${{ needs.changes.outputs.model }}' = 'true' ]; then
            printf 'CALL_ME_MAYBE_MODEL_IMAGE_TAG=%s\n' '${{ github.sha }}' >> .env
          elif [ -n "$MODEL_IMAGE_TAG_LINE" ]; then
            printf '%s\n' "$MODEL_IMAGE_TAG_LINE" >> .env
          else
            printf 'CALL_ME_MAYBE_MODEL_IMAGE_TAG=latest\n' >> .env
          fi

          if [ -n "$TRACEOPS_PASSWORD_LINE" ]; then
            printf '%s\n' "$TRACEOPS_PASSWORD_LINE" >> .env
          fi

          echo '${{ github.token }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          if docker compose version >/dev/null 2>&1; then
            COMPOSE='docker compose'
          elif command -v docker-compose >/dev/null 2>&1; then
            COMPOSE='docker-compose'
          else
            echo 'Docker Compose is not installed on the server.'
            echo 'Install it once on Ubuntu with: sudo apt-get update && sudo apt-get install -y docker-compose-plugin'
            exit 1
          fi
          $COMPOSE pull
          $COMPOSE up -d --remove-orphans
          $COMPOSE ps
          docker image prune -f
          EOF
