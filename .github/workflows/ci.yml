name: CI

on:
  push:
    paths-ignore:
      - README.md
      - AGENTS.md
      - frontend/AGENTS.md
  pull_request:
    paths-ignore:
      - README.md
      - AGENTS.md
      - frontend/AGENTS.md

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      api: ${{ steps.filter.outputs.api }}
      compose: ${{ steps.filter.outputs.compose }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          base_sha="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [[ -z "$base_sha" || "$base_sha" == "0000000000000000000000000000000000000000" ]]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "api=true" >> "$GITHUB_OUTPUT"
            echo "compose=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only "$base_sha" "${{ github.sha }}" > /tmp/changed-files

          if grep -Eq '^(frontend/|\.github/workflows/ci\.yml$)' /tmp/changed-files; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

          if grep -Eq '^(api/|backend/|model_services/|pytest\.ini$|\.github/workflows/ci\.yml$)' /tmp/changed-files; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=false" >> "$GITHUB_OUTPUT"
          fi

          if grep -Eq '^(docker-compose\.yml$|docker-compose\.local\.yml$|deploy/|\.github/workflows/ci\.yml$)' /tmp/changed-files; then
            echo "compose=true" >> "$GITHUB_OUTPUT"
          else
            echo "compose=false" >> "$GITHUB_OUTPUT"
          fi

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

  compose:
    name: Compose validation
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.compose == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production Compose
        env:
          API_IMAGE_TAG: test
          FRONTEND_IMAGE_TAG: test
          CALL_ME_MAYBE_MODEL_IMAGE_TAG: test
        run: docker compose config

      - name: Validate local Compose
        run: docker compose -f docker-compose.local.yml config

  api:
    name: API and backend checks
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.api == 'true'
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: pip install -r api/requirements.txt pytest

      - name: Compile Python modules
        run: python -m compileall api backend/a_maze_ing backend/call_me_maybe backend/trace_ops_agent model_services/call_me_maybe

      - name: Codexion build
        run: make -C backend/codexion

      - name: A_Maze_Ing tests
        run: pytest backend/a_maze_ing/tests

      - name: Trace-Ops-Agent tests
        run: pytest backend/trace_ops_agent/tests

      - name: Call_Me_Maybe tests
        run: pytest backend/call_me_maybe/tests api/projects/call_me_maybe

      - name: Codexion API tests
        run: pytest api/projects/codexion
