services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: traceops
      POSTGRES_USER: traceops
      POSTGRES_PASSWORD: ${TRACEOPS_POSTGRES_PASSWORD:-traceops}
    volumes:
      - traceops-postgres:/var/lib/postgresql/data
      - ./deploy/postgres/init-databases.sql:/docker-entrypoint-initdb.d/10-init-databases.sql:ro
    networks:
      - distillation

  api:
    image: ghcr.io/callmeeric5/distillation-studio-api:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_started
      call-me-maybe-model:
        condition: service_started
    environment:
      CALL_ME_MAYBE_MODEL_URL: http://call-me-maybe-model:8001
      DATABASE_URL: postgresql+asyncpg://traceops:${TRACEOPS_POSTGRES_PASSWORD:-traceops}@postgres:5432/traceops
      PACMAN_DATABASE_URL: postgresql+asyncpg://traceops:${TRACEOPS_POSTGRES_PASSWORD:-traceops}@postgres:5432/pacman
    expose:
      - "8000"
    networks:
      - distillation

  call-me-maybe-model:
    image: ghcr.io/callmeeric5/distillation-studio-call-me-maybe-model:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    environment:
      CALL_ME_MAYBE_MODEL_NAME: Qwen/Qwen3-0.6B
      CALL_ME_MAYBE_MODEL_DEVICE: cpu
      HF_HOME: /models/huggingface
      TRANSFORMERS_CACHE: /models/huggingface
    expose:
      - "8001"
    volumes:
      - call-me-maybe-hf-cache:/models/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 10m
    networks:
      - distillation

  frontend:
    image: ghcr.io/callmeeric5/distillation-studio-frontend:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /home/ubuntu/distillation-studio/certs:/etc/nginx/certs:ro
    networks:
      - distillation

networks:
  distillation:
    driver: bridge

volumes:
  traceops-postgres:
  call-me-maybe-hf-cache:
